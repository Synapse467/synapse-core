name: synapse
services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: synapse
    ports: ["127.0.0.1:5434:5432"]
    volumes: ["synapse-postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:8-alpine
    ports: ["127.0.0.1:6381:6379"]
    volumes: ["synapse-redis:/data"]
    command: redis-server --appendonly yes
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: synapse-local
      MINIO_ROOT_PASSWORD: synapse-local-development-only
    ports: ["127.0.0.1:9002:9000", "127.0.0.1:9003:9001"]
    volumes: ["synapse-objects:/data"]
volumes:
  synapse-postgres:
  synapse-redis:
  synapse-objects:
